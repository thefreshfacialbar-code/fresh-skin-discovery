
name: Fresh Skin Discovery CI

on:
  push:
    branches:
      - main
      - feature/product-workflow-redesign
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Build and Email Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run email regression tests
        run: npx tsx --test src/emails/emailTemplates.test.ts

      - name: Build production application
        run: npm run build
